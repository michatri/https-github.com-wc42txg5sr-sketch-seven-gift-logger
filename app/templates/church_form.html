{% extends "base.html" %}
{% block title %}{{ church.name }}{% endblock %}
{% block content %}
<div class="topbar">
  <div>
    <h2>{{ church.name }}</h2>
    <div class="sub">รหัส {{ church.id }} · {{ church.diocese }}</div>
  </div>
</div>
<form method="post" class="card form-grid">
  <div class="field"><label>ชื่อวัด (ทางการ)</label><input name="name" value="{{ church.name or '' }}"></div>
  <div class="field"><label>ชื่อสามัญ</label><input name="gen_name" value="{{ church.gen_name or '' }}"></div>
  <div class="field span-2"><label>ที่อยู่ 1</label><input name="address1" value="{{ church.address1 or '' }}"></div>
  <div class="field span-2"><label>ที่อยู่ 2</label><input name="address2" value="{{ church.address2 or '' }}"></div>
  <div class="field span-2"><label>โทรศัพท์</label><input name="tel" value="{{ church.tel or '' }}"></div>
  <div class="field"><label>เจ้าอาวาส</label><input name="minister" value="{{ church.minister or '' }}"></div>
  <div class="field"><label>ผู้ช่วย 1</label><input name="asst1" value="{{ church.asst1 or '' }}"></div>
  <div class="field"><label>ผู้ช่วย 2</label><input name="asst2" value="{{ church.asst2 or '' }}"></div>
  <div class="field"><label>ผู้ช่วย 3</label><input name="asst3" value="{{ church.asst3 or '' }}"></div>
  <div class="span-3 actions"><button class="btn gold">บันทึก</button><a class="btn ghost" href="/churches">กลับ</a></div>
</form>
{% endblock %}
