<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เข้าสู่ระบบ · Catholic ID</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="card login-card">
    <div class="cross">✝</div>
    <h1>Catholic ID Web</h1>
    <p class="muted">ระบบทะเบียนสัตบุรุษ / บัตรประจำตัวคาทอลิก จาก CatholicIDv4.5</p>
    <p><b>{{ parish.church_th or 'วัดนักบุญยอแซฟ บ้านโป่ง' }}</b></p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field"><label>ชื่อผู้ใช้</label><input name="username" value="admin" autofocus></div>
      <div class="field"><label>รหัสผ่าน</label><input type="password" name="password"></div>
      <button class="btn gold" type="submit" style="width:100%">เข้าสู่ระบบ</button>
    </form>
    <p class="muted" style="margin-top:14px">ค่าเริ่มต้น: admin / password</p>
  </div>
</div>
</body>
</html>
