{% extends "base.html" %}
{% block title %}เช็คออก · School Check-in{% endblock %}
{% block heading %}เช็คออกจากโรงเรียน{% endblock %}

{% block content %}
<section class="form-panel form-panel-wide">
  <p class="hint">
    เปิดหน้านี้แล้ววางนิ้วได้เลย ไม่ต้องกดปุ่ม
  </p>

  <div class="student-box ready-box" id="status-box">
    <p class="muted" id="status-text">กำลังเตรียมเซนเซอร์...</p>
  </div>

  <div class="result-box" id="result-box" hidden></div>
  <p class="topup-message" id="message" hidden></p>
</section>

<script>
(function () {
  const statusText = document.getElementById("status-text");
  const resultBox = document.getElementById("result-box");
  const messageEl = document.getElementById("message");
  let busy = false;

  function showMessage(text, ok) {
    messageEl.hidden = false;
    messageEl.textContent = text;
    messageEl.className = "topup-message " + (ok ? "ok" : "error");
  }

  function setStatus(text, isError) {
    statusText.textContent = text;
    statusText.className = isError ? "error-text" : "ready-text";
  }

  async function warmSensor() {
    const res = await fetch("{{ url_for('api_sensor_ready') }}", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: "{}"
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.message || "เซนเซอร์ไม่พร้อม");
    return data;
  }

  async function listenLoop() {
    while (true) {
      try {
        if (busy) {
          await new Promise(function (r) { setTimeout(r, 400); });
          continue;
        }
        busy = true;
        await warmSensor();
        setStatus("R307 พร้อมแล้ว — วางนิ้วเพื่อเช็คออก");
        showMessage("รอรับลายนิ้วมือ...", true);

        const res = await fetch("{{ url_for('api_checkout') }}", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: "{}"
        });
        let data = null;
        try { data = await res.json(); }
        catch (e) { throw new Error("เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง (HTTP " + res.status + ")"); }
        if (!res.ok || !data.ok) throw new Error(data.message || "เช็คออกไม่สำเร็จ");

        const r = data.result;
        resultBox.hidden = false;
        resultBox.innerHTML =
          "<p><strong>" + r.student_code + "</strong> " + r.name + "</p>" +
          "<p>เข้า: " + r.check_in_at + "</p>" +
          "<p>ออก: " + r.when + "</p>" +
          "<p>มือ" + r.hand + " · นิ้ว #" + r.finger_id + " · คะแนน " + r.score + "</p>";
        setStatus("เช็คออกสำเร็จ — พร้อมรับคนถัดไป");
        showMessage(data.message + ": " + r.student_code + " " + r.name, true);
        await new Promise(function (r) { setTimeout(r, 1200); });
      } catch (err) {
        setStatus(err.message || "รอสแกนต่อ...", true);
        showMessage(err.message || "เกิดข้อผิดพลาด กำลังรอใหม่", false);
        await new Promise(function (r) { setTimeout(r, 1500); });
      } finally {
        busy = false;
      }
    }
  }

  listenLoop();
})();
</script>
{% endblock %}
