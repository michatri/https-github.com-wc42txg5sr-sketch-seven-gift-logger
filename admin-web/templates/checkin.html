{% extends "base.html" %}
{% block title %}เช็คเข้า · School Check-in{% endblock %}
{% block heading %}เช็คเข้าเรียน{% endblock %}

{% block content %}
<section class="form-panel form-panel-wide">
  <p class="hint">
    กดปุ่มแล้ววางนิ้วทันที (ซ้ายหรือขวาที่ลงทะเบียนไว้)
  </p>

  <button type="button" class="scan-finger-btn" id="scan-btn">สแกนเพื่อเช็คเข้า</button>

  <div class="student-box" id="status-box">
    <p class="muted" id="status-text">กำลังเตรียมเซนเซอร์...</p>
  </div>

  <div class="result-box" id="result-box" hidden></div>
  <p class="topup-message" id="message" hidden></p>
</section>

<script>
(function () {
  const scanBtn = document.getElementById("scan-btn");
  const statusText = document.getElementById("status-text");
  const statusBox = document.getElementById("status-box");
  const resultBox = document.getElementById("result-box");
  const messageEl = document.getElementById("message");

  function showMessage(text, ok) {
    messageEl.hidden = false;
    messageEl.textContent = text;
    messageEl.className = "topup-message " + (ok ? "ok" : "error");
  }

  function setStatus(text, isError) {
    statusText.textContent = text;
    statusText.className = isError ? "error-text" : "muted";
  }

  async function warmSensor() {
    try {
      const res = await fetch("{{ url_for('api_sensor_ready') }}", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: "{}"
      });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.message || "เซนเซอร์ไม่พร้อม");
      setStatus("R307 พร้อมแล้ว — กดปุ่มแล้ววางนิ้วได้เลย");
      showMessage(data.message, true);
    } catch (err) {
      setStatus(err.message || "เซนเซอร์ยังไม่พร้อม", true);
      showMessage(err.message || "เซนเซอร์ยังไม่พร้อม", false);
    }
  }

  async function doCheckin() {
    scanBtn.disabled = true;
    resultBox.hidden = true;
    setStatus("เซนเซอร์พร้อมรับลายนิ้วมือแล้ว — วางนิ้วได้เลย");
    showMessage("กำลังรอวางนิ้วบน R307...", true);
    try {
      const res = await fetch("{{ url_for('api_checkin') }}", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: "{}"
      });
      let data = null;
      try { data = await res.json(); }
      catch (e) { throw new Error("เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง (HTTP " + res.status + ")"); }
      if (!res.ok || !data.ok) throw new Error(data.message || "เช็คเข้าไม่สำเร็จ");

      const r = data.result;
      resultBox.hidden = false;
      resultBox.innerHTML =
        "<p><strong>" + r.student_code + "</strong> " + r.name + "</p>" +
        "<p>มือ" + r.hand + " · นิ้ว #" + r.finger_id + " · คะแนน " + r.score + "</p>" +
        "<p>เวลาเข้า: " + r.when + "</p>";
      setStatus("เช็คเข้าสำเร็จ");
      showMessage(data.message + ": " + r.student_code + " " + r.name, true);
    } catch (err) {
      setStatus(err.message || "เช็คเข้าไม่สำเร็จ", true);
      showMessage(err.message || "เช็คเข้าไม่สำเร็จ", false);
    } finally {
      scanBtn.disabled = false;
    }
  }

  scanBtn.addEventListener("click", doCheckin);
  warmSensor();
})();
</script>
{% endblock %}
