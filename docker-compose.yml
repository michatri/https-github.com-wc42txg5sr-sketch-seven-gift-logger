services:
  catholic-id:
    build: .
    container_name: catholic-id
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./app/data:/opt/catholic-id/app/data
      - ./app/uploads:/opt/catholic-id/app/uploads
    environment:
      CATHOLIC_SECRET: ${CATHOLIC_SECRET:-catholic-id-web-change-me}
