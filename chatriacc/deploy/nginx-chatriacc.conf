# chatriACC behind nginx on a public VPS
# Copy to /etc/nginx/sites-available/chatriacc and enable:
#   sudo ln -s /etc/nginx/sites-available/chatriacc /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Optional TLS: sudo certbot --nginx -d your-domain

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
